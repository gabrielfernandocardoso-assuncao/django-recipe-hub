{% extends 'recipes/base.html' %}

{% block title %} New Recipe {% endblock title %}

{% block content %}
    <div class="col-12">
        <form action="{% url 'new_recipe' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}
            
            <button name="submit" type="submit">
                Add
            </button>
        </form>
    </div>
{% endblock %}
