{% extends 'recipes/base.html' %}
{% load crispy_forms_tags %}

{% block title %} Nova Receita {% endblock title %}

{% block content %}
<div class="row justify-content-center mt-3 mb-5">
    <div class="col-md-8 col-lg-6">
        <div class="card recipe-card p-4 p-md-5 shadow-sm border-0">
            <div class="text-center mb-4">
                <h2 class="font-serif fw-bold text-dark">Adicionar Receita</h2>
                <p class="text-muted">Preencha os dados abaixo para salvar sua criação.</p>
            </div>
            
            <form action="{% url 'new_recipe' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- O filtro crispy aplica as classes do Bootstrap 5 em todos os inputs, labels e textareas automaticamente -->
                <div class="mb-3">
                    {{ form|crispy }}
                </div>
                
                <div class="d-grid mt-4">
                    <button name="submit" type="submit" class="btn btn-custom btn-lg fw-bold shadow-sm py-2">
                        <i class="bi bi-check2-circle"></i> Salvar Receita
                    </button>
                </div>
                
                <div class="text-center mt-3">
                    <a href="{% url 'index' %}" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left"></i> Voltar para a lista
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
